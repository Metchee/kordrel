[package]
name = "kordrel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kordrel, a local resumable workflow orchestrator"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
futures-util = "0.3"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
